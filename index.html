<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <meta name="theme-color" content="#02040b" />
    <title>Hull Rush — Playable Ad</title>
  </head>
  <body>
    <main id="ad" aria-label="Hull Rush playable ad">
      <div id="three-layer" aria-hidden="true"></div>
      <div id="pixi-layer"></div>
      <button id="sound" aria-label="Toggle sound">♪</button>
      <section id="end-card" aria-live="polite">
        <p class="eyebrow">MISSION COMPLETE</p>
        <h1>HULL<br><span>RUSH</span></h1>
        <p id="result">YOU DESTROYED 0 MISSILES</p>
        <button id="cta">PLAY FREE</button>
        <button id="replay">↻ PLAY AGAIN</button>
      </section>
      <div id="rotate"><strong>ROTATE TO PLAY</strong><span>Hull Rush is best in portrait</span></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
